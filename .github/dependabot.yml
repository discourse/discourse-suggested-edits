version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: DEPS
    groups:
      lint-tooling:
        patterns:
          - "*"
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: DEPS
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    groups:
      ruby-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: DEPS
